name: CI

# Runs on every push and every pull request. This is the only automated
# check in the repo today (2026-09-20) — before this workflow existed,
# nothing ran `tsc` at all and three typecheck errors sat on `main`
# unnoticed for days. Every job below must stay required-to-pass; do not
# add `continue-on-error: true` to any step without a documented reason.
#
# This workflow does NOT deploy anything. See deploy.yml (workflow_dispatch
# only) for that.

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 to match the repo's @types/node ^20 pin (package.json) —
      # do not bump this without also revisiting that pin. See the
      # accumulated project memory on the vitest v4/v5 + @types/node
      # constraint before changing either.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Order matters: fail fast on the cheapest checks first.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `next build` also re-runs TypeScript's project check internally,
      # but we still run `tsc --noEmit` as its own step above so a
      # typecheck-only regression is reported clearly and separately from
      # a build failure. No Firebase/Stripe env vars are set here on
      # purpose — src/lib/firebase.ts, functions.ts and appCheck.ts use
      # lazy getters specifically so `next build` succeeds with zero
      # environment configuration (verified locally with .env.local
      # removed entirely before this workflow was written). If a future
      # change makes the build depend on a real env var, that is itself a
      # regression of that lazy-init contract — fix the code, don't just
      # add secrets here to paper over it.
      - name: Build
        run: npm run build
